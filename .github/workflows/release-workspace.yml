name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (do not actually release)'
        required: false
        type: boolean
        default: true
      packages:
        description: 'Packages to release (comma-separated, or "all")'
        required: false
        default: 'all'

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validate release readiness
  validate:
    name: Validate Release Readiness
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 10
    outputs:
      can_release: ${{ steps.check.outputs.can_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-validate
      
      - name: Build embeddenator-workspace
        run: |
          cd embeddenator-workspace
          cargo build --release
      
      - name: Check workspace health
        id: check
        run: |
          echo "Running pre-release health checks..."
          
          # Run health check
          if ./embeddenator-workspace/target/release/embeddenator-workspace health \
              --workspace-root . \
              --check git,version,tests,docs; then
            echo "✅ All health checks passed"
            echo "can_release=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Health checks failed - cannot release"
            echo "can_release=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Uncommitted changes detected"
            git status
            exit 1
          fi
      
      - name: Verify tests pass
        run: |
          echo "Running full test suite..."
          
          repos=(
            embeddenator
            embeddenator-cli
            embeddenator-contract-bench
            embeddenator-fs
            embeddenator-interop
            embeddenator-io
            embeddenator-obs
            embeddenator-retrieval
            embeddenator-testkit
            embeddenator-vsa
            embeddenator-workspace
          )
          
          for repo in "${repos[@]}"; do
            echo "Testing $repo..."
            cargo test --manifest-path "$repo/Cargo.toml" --all-features
          done

  # Bump versions
  bump-versions:
    name: Bump Versions
    runs-on: [self-hosted, linux, x64, podman]
    needs: validate
    if: needs.validate.outputs.can_release == 'true'
    timeout-minutes: 15
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-bump
      
      - name: Build embeddenator-workspace
        run: |
          cd embeddenator-workspace
          cargo build --release
      
      - name: Bump versions
        id: bump
        run: |
          BUMP_FLAG=""
          case "${{ github.event.inputs.version_bump }}" in
            "prerelease")
              BUMP_FLAG="--prerelease"
              ;;
            "patch")
              BUMP_FLAG="--patch"
              ;;
            "minor")
              BUMP_FLAG="--minor"
              ;;
            "major")
              BUMP_FLAG="--major"
              ;;
          esac
          
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          echo "Running version bump: $BUMP_FLAG $DRY_RUN_FLAG"
          
          OUTPUT=$(./embeddenator-workspace/target/release/embeddenator-workspace bump-version \
            --workspace-root . \
            $BUMP_FLAG \
            $DRY_RUN_FLAG \
            --verbose)
          
          echo "$OUTPUT"
          
          # Extract new version from output
          NEW_VERSION=$(echo "$OUTPUT" | grep -oP 'New version: \K[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?' | head -1)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION"
      
      - name: Commit version changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push
      
      - name: Create release tag
        if: github.event.inputs.dry_run != 'true'
        run: |
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"

  # Build release artifacts
  build-artifacts:
    name: Build Release Artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-latest' || fromJSON('["self-hosted", "linux", "x64", "podman"]') }}
    needs: bump-versions
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: embeddenator-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: embeddenator-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: embeddenator-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: embeddenator-macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-versions.outputs.new_version }}
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p embeddenator
          cargo build --release --target ${{ matrix.target }} -p embeddenator-cli
          cargo build --release --target ${{ matrix.target }} -p embeddenator-workspace
      
      - name: Package artifacts
        run: |
          mkdir -p artifacts/${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/embeddenator artifacts/${{ matrix.artifact_name }}/
          cp target/${{ matrix.target }}/release/embeddenator-cli artifacts/${{ matrix.artifact_name }}/
          cp target/${{ matrix.target }}/release/embeddenator-workspace artifacts/${{ matrix.artifact_name }}/
          cp README.md LICENSE artifacts/${{ matrix.artifact_name }}/
          
          cd artifacts
          tar czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}.tar.gz
          retention-days: 30

  # Create GitHub release
  create-release:
    name: Create GitHub Release
    runs-on: [self-hosted, linux, x64, podman]
    needs: [bump-versions, build-artifacts]
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-versions.outputs.new_version }}
          fetch-depth: 0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "# Release Notes" > release-notes.md
            echo "" >> release-notes.md
            echo "## Changes since $PREVIOUS_TAG" >> release-notes.md
            echo "" >> release-notes.md
            git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%an)" >> release-notes.md
          else
            echo "# Release Notes" > release-notes.md
            echo "" >> release-notes.md
            echo "Initial release" >> release-notes.md
          fi
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.bump-versions.outputs.new_version }}
          name: Release v${{ needs.bump-versions.outputs.new_version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.bump-versions.outputs.new_version, '-') }}
          files: |
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: [self-hosted, linux, x64, podman]
    needs: [bump-versions, create-release]
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump-versions.outputs.new_version }}
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Publish packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish in dependency order (bottom-up)
          packages=(
            "embeddenator-vsa"
            "embeddenator-obs"
            "embeddenator-io"
            "embeddenator-interop"
            "embeddenator-retrieval"
            "embeddenator-fs"
            "embeddenator-testkit"
            "embeddenator-contract-bench"
            "embeddenator-cli"
            "embeddenator-workspace"
            "embeddenator"
          )
          
          for package in "${packages[@]}"; do
            echo "Publishing $package..."
            cd "$package"
            
            # Check if already published
            VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
            if cargo search "$package" --limit 1 | grep -q "$VERSION"; then
              echo "⚠️ $package $VERSION already published, skipping"
            else
              cargo publish --allow-dirty || true
              # Wait to avoid rate limiting
              sleep 30
            fi
            
            cd ..
          done
