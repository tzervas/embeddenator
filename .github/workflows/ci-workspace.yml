name: Workspace CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug output (RUST_BACKTRACE, RUST_LOG)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  # Debug disabled by default - enable via workflow_dispatch with debug_mode=true
  RUST_BACKTRACE: ${{ inputs.debug_mode && '1' || '0' }}
  RUST_LOG: ${{ inputs.debug_mode && 'debug' || '' }}
  # Repositories to test
  REPOS: >
    embeddenator-core
    embeddenator-cli
    embeddenator-contract-bench
    embeddenator-fs
    embeddenator-interop
    embeddenator-io
    embeddenator-obs
    embeddenator-retrieval
    embeddenator-testkit
    embeddenator-vsa
    embeddenator-workspace

jobs:
  # Quick format check - fails fast
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: |
          echo "Checking formatting across all repositories..."
          failed=0
          for repo in ${{ env.REPOS }}; do
            if [ -d "$repo" ]; then
              echo "📦 Checking $repo..."
              if ! cargo fmt --manifest-path "$repo/Cargo.toml" --check; then
                echo "❌ $repo: formatting issues found"
                failed=1
              else
                echo "✅ $repo: properly formatted"
              fi
            fi
          done
          exit $failed

  # Matrix-based parallel testing
  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: format-check
    strategy:
      fail-fast: false
      matrix:
        package:
          - embeddenator-core
          - embeddenator-cli
          - embeddenator-contract-bench
          - embeddenator-fs
          - embeddenator-interop
          - embeddenator-io
          - embeddenator-obs
          - embeddenator-retrieval
          - embeddenator-testkit
          - embeddenator-vsa
          - embeddenator-workspace
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-ci-${{ matrix.package }}
          cache-on-failure: true
      
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Clippy
        run: |
          cd ${{ matrix.package }}
          cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Build
        run: |
          cd ${{ matrix.package }}
          cargo build --all-features
      
      - name: Test (quiet first pass)
        id: test_quiet
        continue-on-error: true
        run: |
          cd ${{ matrix.package }}
          cargo nextest run --all-features --no-fail-fast 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      
      - name: Re-run failed tests with debug
        if: steps.test_quiet.outputs.exit_code != '0'
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
        run: |
          cd ${{ matrix.package }}
          echo "::group::Re-running failed tests with debug output"
          cargo nextest run --all-features --run-ignored=all --retries 0 --failure-output immediate-final
          echo "::endgroup::"

  # Integration tests - tests cross-component workflows
  # Integration tests are now part of embeddenator-testkit (--features integration)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-integration
          cache-on-failure: true
      
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Build embeddenator-testkit with integration feature
        run: |
          cd embeddenator-testkit
          cargo build --features integration --all-targets
      
      - name: Run integration tests (quiet first pass)
        id: integration_quiet
        continue-on-error: true
        run: |
          cd embeddenator-testkit
          cargo nextest run --features integration --no-fail-fast 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      
      - name: Re-run failed integration tests with debug
        if: steps.integration_quiet.outputs.exit_code != '0'
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
        run: |
          cd embeddenator-testkit
          echo "::group::Re-running failed tests with debug output"
          cargo nextest run --features integration --run-ignored=all --retries 0 --failure-output immediate-final
          echo "::endgroup::"

  # Workspace health check using embeddenator-workspace tool
  health-check:
    name: Workspace Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-health
      
      - name: Build embeddenator-workspace
        run: |
          cd embeddenator-workspace
          cargo build --release
      
      - name: Run health checks
        id: health
        run: |
          ./embeddenator-workspace/target/release/embeddenator-workspace health \
            --workspace-root . \
            --check version,tests,docs,specs \
            --output health-report.md
      
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md
          retention-days: 30
      
      - name: Comment PR with health report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('health-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🏥 Workspace Health Report\n\n' + report
            });

  # Version consistency check
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: format-check
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-version
      
      - name: Build embeddenator-workspace
        run: |
          cd embeddenator-workspace
          cargo build --release
      
      - name: Check version consistency
        run: |
          ./embeddenator-workspace/target/release/embeddenator-workspace check-versions --verbose

  # Documentation build - ensures all docs build without warnings
  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-docs
      
      - name: Build documentation
        run: |
          echo "Building documentation for all packages..."
          failed=0
          for repo in ${{ env.REPOS }}; do
            if [ -d "$repo" ]; then
              echo "📚 Building docs for $repo..."
              if ! cargo doc --manifest-path "$repo/Cargo.toml" --all-features --no-deps; then
                echo "❌ $repo: documentation build failed"
                failed=1
              else
                echo "✅ $repo: documentation built successfully"
              fi
            fi
          done
          exit $failed
      
      - name: Upload documentation
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc
          retention-days: 7

  # Multi-version Rust testing
  rust-versions:
    name: Rust ${{ matrix.rust }} (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: format-check
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
        package: [embeddenator-vsa, embeddenator-workspace, embeddenator-testkit]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust }}-${{ matrix.package }}
      
      - name: Build and test
        id: test_quiet
        continue-on-error: true
        run: |
          cd ${{ matrix.package }}
          cargo build --all-features
          cargo test --all-features 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      
      - name: Re-run failed with debug
        if: steps.test_quiet.outputs.exit_code != '0'
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
        run: |
          cd ${{ matrix.package }}
          echo "::group::Re-running failed tests with debug output"
          cargo test --all-features -- --nocapture
          echo "::endgroup::"

  # Code coverage generation and upload
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: format-check
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      
      - name: Generate coverage
        run: |
          repos=(
            embeddenator-core
            embeddenator-cli
            embeddenator-contract-bench
            embeddenator-fs
            embeddenator-interop
            embeddenator-io
            embeddenator-obs
            embeddenator-retrieval
            embeddenator-testkit
            embeddenator-vsa
            embeddenator-workspace
          )
          
          # Run tarpaulin for each component
          for repo in "${repos[@]}"; do
            echo "📊 Generating coverage for $repo..."
            cargo tarpaulin \
              --manifest-path "$repo/Cargo.toml" \
              --workspace \
              --all-features \
              --timeout 300 \
              --out Xml \
              --output-dir coverage \
              --skip-clean || echo "⚠️ Coverage failed for $repo"
          done
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
          flags: workspace
          name: embeddenator-workspace
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

  # Final CI status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [format-check, test, integration-tests, health-check, version-check, docs, rust-versions, coverage]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.format-check.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.health-check.result }}" != "success" ]] || \
             [[ "${{ needs.version-check.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.rust-versions.result }}" != "success" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          
          # Coverage is allowed to fail without blocking
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "⚠️ Code coverage did not complete successfully"
          fi
          
          echo "✅ All CI checks passed!"
