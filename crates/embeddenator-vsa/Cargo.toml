[package]
name = "embeddenator-vsa"
version = "0.23.0"
edition = "2021"
rust-version = "1.92"
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
description = "Vector Symbolic Architecture operations for sparse ternary representations"
license = "MIT"
repository = "https://github.com/tzervas/embeddenator-vsa"
documentation = "https://docs.rs/embeddenator-vsa"
keywords = ["embeddenator", "vsa", "holographic", "sparse-ternary"]
categories = ["algorithms", "data-structures", "memory-management"]

[features]
default = ["simd"]
simd = []
block-sparse = []
cuda = ["dep:cudarc"]
trit-vsa-simd = ["trit-vsa/simd"]

[dependencies]
rand = ">=0.9, <1.0"
serde = { version = ">=1.0, <2.0", features = ["derive"] }
sha2 = ">=0.10, <1.0"
serde_json = ">=1.0, <2.0"
libc = ">=0.2, <1.0"
rustc-hash = ">=2.1, <3.0"
rayon = ">=1.8, <2.0"
cudarc = { version = "0.19", optional = true, features = ["cuda-version-from-build-system"] }
trit-vsa = { version = "0.3.0", default-features = false }

[dev-dependencies]
proptest = ">=1.0, <2.0"
criterion = ">=0.8, <1.0"
tempfile = "3.25"

[[bench]]
name = "vsa_ops"
harness = false

[[bench]]
name = "simd_cosine"
harness = false

[[bench]]
name = "cuda"
harness = false
required-features = ["cuda"]
