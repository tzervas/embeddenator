[package]
name = "embeddenator-interop"
version = "0.22.0"
edition = "2021"
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
description = "Kernel interop and system integration for Embeddenator"
license = "MIT"
repository = "https://github.com/tzervas/embeddenator-interop"
documentation = "https://docs.rs/embeddenator-interop"
keywords = ["embeddenator", "kernel", "interop", "system"]
categories = ["os"]

[features]
default = []
python = ["pyo3"]
c-bindings = []
compression-zstd = ["embeddenator-io/compression-zstd"]
compression-lz4 = ["embeddenator-io/compression-lz4"]
compression = ["compression-zstd", "compression-lz4"]

[dependencies]
embeddenator-vsa = { workspace = true }
embeddenator-fs = { workspace = true }
embeddenator-io = { workspace = true }

# Serialization
serde = { version = ">=1.0, <2.0", features = ["derive"] }
serde_json = ">=1.0, <2.0"
bincode = ">=1.3, <2.0"

# Python bindings (optional) - RUSTSEC-2025-0020 requires >=0.24.1
pyo3 = { version = ">=0.24.1, <1.0", features = ["extension-module"], optional = true }

[dev-dependencies]
proptest = ">=1.0, <2.0"
tempfile = ">=3.8, <4.0"

[build-dependencies]
cbindgen = ">=0.27, <1.0"
