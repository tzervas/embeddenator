[package]
name = "embeddenator-retrieval"
version = "0.22.0"
edition = "2021"
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
description = "Semantic retrieval and search operations for VSA-based vector representations"
license = "MIT"
repository = "https://github.com/tzervas/embeddenator-retrieval"
documentation = "https://docs.rs/embeddenator-retrieval"
keywords = ["embeddenator", "retrieval", "holographic", "search", "vsa"]
categories = ["algorithms", "data-structures"]

[features]
default = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
# Note: bincode 3.0.0 has intentional compile_error (XKCD 2347 protest)
# Use 1.x which has compatible serialize/deserialize API
bincode = ">=1.3, <2.0"
rayon = ">=1.8, <2.0"
embeddenator-vsa = { workspace = true }

[dev-dependencies]
proptest = "1.0"
criterion = "0.8"
tempfile = "3.0"
# crates.io version pin (no path). embeddenator-fs remains a root gitlink
# until PR4. Only benches/query_hierarchical.rs wants it.
# A live `embeddenator-fs = "0.25"` pulls crates.io retrieval 0.22.0
# (fs → retrieval ≥0.20,<1.0) and makes `cargo test -p embeddenator-retrieval`
# ambiguous. Unify would cycle. Leave the pin; do not run benches.
# embeddenator-fs = "0.25"

[[bench]]
name = "retrieval"
harness = false

[[bench]]
name = "search_performance"
harness = false

[[bench]]
name = "query_hierarchical"
harness = false
