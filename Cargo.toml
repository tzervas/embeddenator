[package]
name = "embeddenator"
version = "0.20.0-alpha.1"
edition = "2021"
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
description = "⚠️ DEPRECATED: Use component repos instead (embeddenator-vsa, embeddenator-fs, etc). See DEPRECATED.md for migration guide."
license = "MIT"
repository = "https://github.com/tzervas/embeddenator"
homepage = "https://github.com/tzervas/embeddenator"
keywords = ["vsa", "holographic", "vector-symbolic", "ternary", "deprecated"]
categories = ["filesystem", "encoding", "science", "experimental"]
documentation = "https://docs.rs/embeddenator"
readme = "README.md"

[package.metadata.deprecated]
deprecated = true
since = "0.20.0-alpha.1"
date = "2026-01-16"
reason = "Migrated to component-based architecture"
archive_date = "2026-06-01"
removal_date = "2026-09-01"
migration_guide = "DEPRECATED.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "embeddenator"
path = "src/lib.rs"
doctest = true

[[bench]]
name = "vsa_ops"
harness = false

[[bench]]
name = "retrieval"
harness = false

[[bench]]
name = "hierarchical_scale"
harness = false

[[bench]]
name = "query_hierarchical"
harness = false

[[bench]]
name = "simd_cosine"
harness = false

[[bin]]
name = "embeddenator"
path = "src/main.rs"

[dependencies]
# Embeddenator component libraries (using path for dev, published versions for release)
embeddenator-vsa = { path = "../embeddenator-vsa", version = ">=0.20.1, <1.0.0" }
embeddenator-retrieval = { path = "../embeddenator-retrieval", version = ">=0.20.0, <1.0.0" }
embeddenator-fs = { path = "../embeddenator-fs", version = ">=0.22.0, <1.0.0" }
embeddenator-interop = { path = "../embeddenator-interop", version = ">=0.21.0, <1.0.0" }
embeddenator-io = { path = "../embeddenator-io", version = ">=0.20.0, <1.0.0" }
embeddenator-obs = { path = "../embeddenator-obs", version = ">=0.21.0, <1.0.0", features = ["tracing"] }
embeddenator-cli = { path = "../embeddenator-cli", version = ">=0.20.0-alpha.2, <1.0.0" }

# External dependencies
clap = { version = ">=4.5, <5.0", features = ["derive"] }
serde = { version = ">=1.0, <2.0", features = ["derive"] }
serde_json = ">=1.0, <2.0"
bincode = ">=1.3, <2.0"
sha2 = ">=0.10, <1.0"
rand = ">=0.8, <1.0"
walkdir = ">=2.5, <3.0"
# FUSE userspace filesystem (Linux/macOS only)
fuser = { version = ">=0.16, <1.0", optional = true }
libc = ">=0.2, <1.0"
# Performance tuning
rayon = ">=1.7, <2.0"
num_cpus = ">=1.16, <2.0"
parking_lot = ">=0.12, <1.0"
smallvec = ">=1.11, <2.0"

[dev-dependencies]
tempfile = ">=3.13, <4.0"
criterion = ">=0.5, <1.0"
proptest = ">=1.4, <2.0"

[features]
default = []
fuse = ["fuser"]
qa = []
soak-memory = []
simd = []

# Heavy invariant tests / aggressive randomized checks for ternary refactors.
ternary-refactor = []

# Balanced-ternary migration phases (testing gates)
#
# Enable these progressively as the ternary-native substrate replaces SparseVec
# internals. Each phase implies the previous phase and enables the heavy
# refactor invariant suite.
bt-phase-1 = ["ternary-refactor"]
bt-phase-2 = ["bt-phase-1"]
bt-phase-3 = ["bt-phase-2"]

# Convenience for CI/local: run everything currently implemented.
bt-migration = ["bt-phase-3"]

# These are referenced by cfg-gated test stubs; define them to avoid
# `unexpected cfg condition value` warnings when compiling tests.
proptest = []
afl = []

# Reserved for a future on-disk deterministic baseline codebook loader/generator.
baseline-codebook = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Aggressive optimizations for maximum throughput
[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Enable all SIMD and tuning
debug-assertions = false
