[workspace]
resolver = "2"
members = [
    "crates/embeddenator-vsa",
    "crates/embeddenator-io",
    "crates/embeddenator-obs",
    "crates/embeddenator-retrieval",
    "crates/embeddenator-fs",
    "crates/embeddenator-interop",
]
# default-members stay vsa+io+obs+retrieval so `cargo test` stays fast.
# fs/interop are members (path-resolvable) but not default: fs has heavy
# optional features (fuse/disk-image) and slow integration tests
# (large_file/concurrent_stress/scale/vm_boot). fs default = [] so it
# *could* be a default-member; we omit it anyway. Use
# `cargo test -p embeddenator-fs --lib` / selected --test filters, and
# `cargo test -p embeddenator-interop` (no python/c-bindings).
default-members = [
    "crates/embeddenator-vsa",
    "crates/embeddenator-io",
    "crates/embeddenator-obs",
    "crates/embeddenator-retrieval",
]

[workspace.package]
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
repository = "https://github.com/tzervas/embeddenator"

[workspace.dependencies]
trit-vsa = { version = "0.3.0", default-features = false }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
embeddenator-vsa = { version = "0.23.0", path = "crates/embeddenator-vsa" }
embeddenator-io = { version = "0.21.0", path = "crates/embeddenator-io" }
embeddenator-obs = { version = "0.21.0", path = "crates/embeddenator-obs" }
embeddenator-retrieval = { version = "0.22.0", path = "crates/embeddenator-retrieval" }
embeddenator-fs = { version = "0.25.0", path = "crates/embeddenator-fs" }
embeddenator-interop = { version = "0.22.0", path = "crates/embeddenator-interop" }

[workspace.metadata.embeddenator]
# embeddenator-vsa/cuda → cudarc
# trit-vsa/cuda         → cubecl
# Never enable both.
cuda-policy = "exclusive"
