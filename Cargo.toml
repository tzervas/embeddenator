[workspace]
resolver = "2"
members = [
    "crates/embeddenator-vsa",
    "crates/embeddenator-io",
    "crates/embeddenator-obs",
]
default-members = [
    "crates/embeddenator-vsa",
    "crates/embeddenator-io",
    "crates/embeddenator-obs",
]

[workspace.package]
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
repository = "https://github.com/tzervas/embeddenator"

[workspace.dependencies]
trit-vsa = { version = "0.3.0", default-features = false }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
embeddenator-io = { version = "0.21.0", path = "crates/embeddenator-io" }
embeddenator-obs = { version = "0.21.0", path = "crates/embeddenator-obs" }

[workspace.metadata.embeddenator]
# embeddenator-vsa/cuda → cudarc
# trit-vsa/cuda         → cubecl
# Never enable both.
cuda-policy = "exclusive"
